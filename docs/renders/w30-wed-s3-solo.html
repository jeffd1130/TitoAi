<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden}
.slide{width:1080px;height:1350px;background:#0A0F1E;position:relative;display:flex;flex-direction:column;justify-content:center;padding:80px 90px;overflow:hidden}
.slide::before{content:'';position:absolute;top:-120px;right:-120px;width:420px;height:420px;border-radius:50%;background:#F59E0B;opacity:.04;pointer-events:none}
.slide::after{content:'';position:absolute;bottom:-80px;left:-80px;width:300px;height:300px;border-radius:50%;background:#0D9488;opacity:.05;pointer-events:none}
.label{font-family:'DM Sans',sans-serif;font-size:22px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#475569;margin-bottom:28px}
.t-line{font-family:'Bebas Neue',Impact,sans-serif;font-size:118px;line-height:0.95;letter-spacing:2px;display:block}
.t-gold{color:#F59E0B}.t-white{color:#ffffff}.t-teal{color:#0D9488}
.divider{width:100%;height:3px;background:linear-gradient(90deg,#F59E0B 0%,rgba(245,158,11,.15) 100%);margin:28px 0}
.prompt-box{background:#0D1B2A;border:2px solid #F59E0B;border-radius:16px;padding:28px 32px;margin-top:8px}
.prompt-line{font-family:'DM Sans',sans-serif;font-size:28px;color:#E2E8F0;line-height:1.9}
.bracket{color:#F59E0B;font-weight:700}
.prompt-note{font-family:'DM Sans',sans-serif;font-size:22px;color:#475569;margin-top:18px;font-style:italic}
.footer{position:absolute;bottom:52px;left:90px;right:90px;display:flex;align-items:center;justify-content:space-between}
.footer img{height:68px;opacity:.9}
.pips{display:flex;gap:8px}
.pip{width:10px;height:10px;border-radius:50%;background:#1E293B}
.pip.active{background:#F59E0B}
</style></head>
<body>
<div class="slide">
  <div class="label">Tito AI · W30 Wed · I-type Mo Ito</div>
  <span class="t-line t-white">I-TYPE</span>
  <span class="t-line t-gold">MO ITO</span>
  <span class="t-line t-teal">SA CLAUDE.</span>
  <div class="divider"></div>
  <div class="prompt-box">
    <div class="prompt-line">"Ako ay <span class="bracket">[VA / freelancer / negosyante]</span>.</div>
    <div class="prompt-line">Kailangan ko ng <span class="bracket">[email / proposal / caption]</span>.</div>
    <div class="prompt-line">Para sa <span class="bracket">[kliyente / boss / produkto]</span>.</div>
    <div class="prompt-line">Gawing malinaw at propesyonal."</div>
  </div>
  <div class="prompt-note">claude.ai — libre. Palitan mo lang ang brackets.</div>
  <div class="footer">
    <img src="http://localhost:8766/assets/logo-horizontal.png" alt="Tito AI">
    <div class="pips"><div class="pip"></div><div class="pip"></div><div class="pip active"></div><div class="pip"></div><div class="pip"></div></div>
  </div>
</div>
</body></html>
