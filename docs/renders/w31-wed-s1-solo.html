<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden}
.slide{width:1080px;height:1350px;background:#0A0F1E;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:80px 90px 160px;overflow:hidden}
.photo-zone{position:absolute;top:0;left:0;width:100%;height:65%;background:linear-gradient(135deg,#0d1a2e 0%,#162035 40%,#0e1c38 60%,#0A0F1E 100%);display:flex;align-items:center;justify-content:center}
.photo-label{font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:rgba(245,158,11,.3);border:2px dashed rgba(245,158,11,.2);padding:20px 36px;border-radius:8px}
.overlay{position:absolute;top:0;left:0;width:100%;height:70%;background:linear-gradient(180deg,transparent 30%,#0A0F1E 100%)}
.content{position:relative;z-index:2}
.label{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#475569;margin-bottom:20px}
.t-line{font-family:'Bebas Neue',Impact,sans-serif;font-size:104px;line-height:0.92;letter-spacing:2px;display:block}
.t-gold{color:#F59E0B}.t-white{color:#ffffff}.t-teal{color:#0D9488}
.divider{width:100%;height:3px;background:linear-gradient(90deg,#F59E0B 0%,rgba(245,158,11,.15) 100%);margin:28px 0}
.sub{font-family:'DM Sans',sans-serif;font-size:34px;color:#94A3B8;line-height:1.5}
.footer{position:absolute;bottom:52px;left:90px;right:90px;display:flex;align-items:center;justify-content:space-between}
.footer img{height:68px;opacity:.9}
.pips{display:flex;gap:8px}
.pip{width:10px;height:10px;border-radius:50%;background:#1E293B}
.pip.active{background:#F59E0B}
</style></head>
<body>
<div class="slide">
  <div class="photo-zone"><div class="photo-label">REPLACE WITH PHOTO</div></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="label">Tito AI · W31 Wed · Freelancer Tip</div>
    <span class="t-line t-white">PROPOSAL SA</span>
    <span class="t-line t-gold">KLIYENTE —</span>
    <span class="t-line t-teal">BLANGKO PA.</span>
    <div class="divider"></div>
    <div class="sub">Alam mo ang trabaho. Ang sulat? Iyon ang problema.</div>
  </div>
  <div class="footer">
    <img src="http://localhost:8766/assets/logo-horizontal.png" alt="Tito AI">
    <div class="pips"><div class="pip active"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
  </div>
</div>
</body></html>
