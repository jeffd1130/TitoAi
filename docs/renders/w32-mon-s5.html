<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>W32 Mon S5 CTA</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0A0F1E}
.slide{width:1080px;height:1350px;background:#0A0F1E;position:relative;display:flex;flex-direction:column;overflow:hidden;padding:80px 90px 120px}
.slide::before{content:'';position:absolute;top:-120px;right:-120px;width:420px;height:420px;border-radius:50%;background:#F59E0B;opacity:.04;pointer-events:none}
.slide::after{content:'';position:absolute;bottom:-80px;left:-80px;width:300px;height:300px;border-radius:50%;background:#0D9488;opacity:.05;pointer-events:none}
.lbl2{font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:28px}
.headline{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:2px;line-height:.92;display:block}
.h-white{color:#fff}
.h-gold{color:#F59E0B}
.h-teal{color:#0D9488}
.divider{width:100%;height:3px;background:linear-gradient(90deg,#F59E0B 0%,rgba(245,158,11,.15) 100%);margin:32px 0}
.list{display:flex;flex-direction:column;gap:18px;margin-top:4px}
.item{display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px 26px}
.num{font-family:'Bebas Neue',Impact,sans-serif;font-size:36px;color:#F59E0B;line-height:1;min-width:32px}
.item-txt{font-family:'DM Sans',sans-serif;font-size:27px;font-weight:600;color:rgba(255,255,255,.9);line-height:1.3}
.cta-line{font-family:'DM Sans',sans-serif;font-size:30px;color:#94A3B8;margin-top:24px;line-height:1.5}
.handle{color:#F59E0B;font-weight:700}
.footer{position:absolute;bottom:52px;left:90px;right:90px;display:flex;align-items:center;justify-content:space-between}
.footer img{height:68px;opacity:.9}
.fpips{display:flex;gap:8px}
.fpip{width:10px;height:10px;border-radius:50%;background:#1E293B}
.fpip.a{background:#F59E0B}
</style>
</head><body>
<div class="slide" data-document-role="page" data-label="S5 CTA">
  <div class="lbl2">Tito AI · W32 Mon · CTA</div>
  <span class="headline h-white" style="font-size:92px">TATLONG</span>
  <span class="headline h-gold" style="font-size:92px">LANDAS PARA</span>
  <span class="headline h-white" style="font-size:92px">MAGSIMULA:</span>
  <div class="divider"></div>
  <div class="list">
    <div class="item"><div class="num">1</div><div class="item-txt">AI data storytelling para sa sports o business brands</div></div>
    <div class="item"><div class="num">2</div><div class="item-txt">Automated insight reports para sa clients</div></div>
    <div class="item"><div class="num">3</div><div class="item-txt">Prompt consulting para sa teams na hindi tech-savvy</div></div>
  </div>
  <div class="cta-line">claude.ai — libre 🇵🇭 · <span class="handle">@tito.aiph</span></div>
  <div class="footer">
    <img src="https://jeffd1130.github.io/TitoAi/assets/logo-horizontal.png" alt="Tito AI">
    <div class="fpips"><div class="fpip"></div><div class="fpip"></div><div class="fpip"></div><div class="fpip"></div><div class="fpip a"></div></div>
  </div>
</div>
</body></html>
