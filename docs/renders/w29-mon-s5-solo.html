<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden}
.slide{width:1080px;height:1350px;background:#0A0F1E;position:relative;display:flex;flex-direction:column;justify-content:center;padding:80px 90px;overflow:hidden}
.slide::before{content:'';position:absolute;top:-120px;right:-120px;width:420px;height:420px;border-radius:50%;background:#F59E0B;opacity:.04;pointer-events:none}
.slide::after{content:'';position:absolute;bottom:-80px;left:-80px;width:300px;height:300px;border-radius:50%;background:#0D9488;opacity:.05;pointer-events:none}
.label{font-family:'DM Sans',sans-serif;font-size:22px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#475569;margin-bottom:20px}
.t-line{font-family:'Bebas Neue',Impact,sans-serif;font-size:118px;line-height:1.0;letter-spacing:2px;display:block}
.t-gold{color:#F59E0B}.t-white{color:#ffffff}.t-teal{color:#0D9488}
.divider{width:100%;height:3px;background:linear-gradient(90deg,#F59E0B 0%,rgba(245,158,11,.15) 100%);margin:32px 0}
.body-text{font-family:'DM Sans',sans-serif;font-size:38px;color:#CBD5E1;line-height:1.6}
.chips{display:flex;flex-direction:column;gap:14px;margin-top:24px}
.chip{display:inline-block;background:#0D9488;color:#ffffff;font-family:'DM Sans',sans-serif;font-size:30px;font-weight:700;padding:12px 28px;border-radius:40px;width:fit-content;letter-spacing:1px}
.handle{font-family:'DM Sans',sans-serif;font-size:30px;font-weight:700;color:#F59E0B;margin-top:24px;letter-spacing:1px}
.footer{position:absolute;bottom:52px;left:90px;right:90px;display:flex;align-items:center;justify-content:space-between}
.footer img{height:68px;opacity:.9}
.pips{display:flex;gap:8px}
.pip{width:10px;height:10px;border-radius:50%;background:#1E293B}
.pip.active{background:#F59E0B}
</style></head>
<body>
<div class="slide">
  <div class="label">Tito AI · W29 Lunes · CTA</div>
  <span class="t-line t-gold">LIBRE.</span>
  <span class="t-line t-white">SUBUKAN</span>
  <span class="t-line t-teal">MO NGAYON.</span>
  <div class="divider"></div>
  <div class="body-text">Pumunta sa:</div>
  <div class="chips">
    <div class="chip">claude.ai</div>
    <div class="chip">gemini.google.com</div>
  </div>
  <div class="handle">@tito.aiph · AI Para Sa Ating Lahat 🇵🇭</div>
  <div class="footer">
    <img src="http://localhost:8765/assets/logo-horizontal.png" alt="Tito AI">
    <div class="pips"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip active"></div></div>
  </div>
</div>
</body></html>
