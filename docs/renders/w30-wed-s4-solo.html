<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden}
.slide{width:1080px;height:1350px;background:#0A0F1E;position:relative;display:flex;flex-direction:column;justify-content:center;padding:80px 90px;overflow:hidden}
.slide::before{content:'';position:absolute;top:-120px;right:-120px;width:420px;height:420px;border-radius:50%;background:#F59E0B;opacity:.04;pointer-events:none}
.slide::after{content:'';position:absolute;bottom:-80px;left:-80px;width:300px;height:300px;border-radius:50%;background:#0D9488;opacity:.05;pointer-events:none}
.label{font-family:'DM Sans',sans-serif;font-size:22px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#475569;margin-bottom:20px}
.t-line{font-family:'Bebas Neue',Impact,sans-serif;font-size:108px;line-height:0.95;letter-spacing:2px;display:block}
.t-gold{color:#F59E0B}.t-white{color:#ffffff}.t-teal{color:#0D9488}
.divider{width:100%;height:3px;background:linear-gradient(90deg,#F59E0B 0%,rgba(245,158,11,.15) 100%);margin:22px 0}
.cards{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.card{background:#111827;border-left:4px solid #F59E0B;border-radius:0 12px 12px 0;padding:18px 22px}
.card-label{font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#F59E0B;margin-bottom:6px}
.card-text{font-family:'DM Sans',sans-serif;font-size:24px;color:#CBD5E1;line-height:1.4}
.card:nth-child(2){border-left-color:#0D9488}
.card:nth-child(2) .card-label{color:#0D9488}
.card:nth-child(3){border-left-color:#ffffff}
.card:nth-child(3) .card-label{color:#ffffff}
.footer{position:absolute;bottom:52px;left:90px;right:90px;display:flex;align-items:center;justify-content:space-between}
.footer img{height:68px;opacity:.9}
.pips{display:flex;gap:8px}
.pip{width:10px;height:10px;border-radius:50%;background:#1E293B}
.pip.active{background:#F59E0B}
</style></head>
<body>
<div class="slide">
  <div class="label">Tito AI · W30 Wed · Ang Resulta</div>
  <span class="t-line t-white">ISANG</span>
  <span class="t-line t-gold">PROMPT.</span>
  <span class="t-line t-teal">TATLONG TRABAHO.</span>
  <div class="divider"></div>
  <div class="cards">
    <div class="card">
      <div class="card-label">VA</div>
      <div class="card-text">"Dear Client, just following up on the proposal we sent last Tuesday..."</div>
    </div>
    <div class="card">
      <div class="card-label">Freelancer</div>
      <div class="card-text">"Here's my proposal: logo delivered in 3 days, 2 revisions included..."</div>
    </div>
    <div class="card">
      <div class="card-label">Negosyante</div>
      <div class="card-text">"Bagong produkto! Limited stock lang — order na bago maubos! 🔥"</div>
    </div>
  </div>
  <div class="footer">
    <img src="http://localhost:8766/assets/logo-horizontal.png" alt="Tito AI">
    <div class="pips"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip active"></div><div class="pip"></div></div>
  </div>
</div>
</body></html>
