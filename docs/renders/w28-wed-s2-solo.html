<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden}
.slide{width:1080px;height:1350px;background:#0A0F1E;position:relative;display:flex;flex-direction:column;justify-content:center;padding:80px 90px;overflow:hidden}
.slide::before{content:'';position:absolute;top:-120px;right:-120px;width:420px;height:420px;border-radius:50%;background:#0D9488;opacity:.04;pointer-events:none}
.t-line{font-family:'Bebas Neue',Impact,sans-serif;font-size:118px;line-height:1.0;letter-spacing:2px;display:block}
.t-gold{color:#F59E0B}.t-white{color:#ffffff}.t-teal{color:#0D9488}
.divider{width:100%;height:3px;background:linear-gradient(90deg,#F59E0B 0%,rgba(245,158,11,.15) 100%);margin:28px 0}
.label{font-family:'DM Sans',sans-serif;font-size:22px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#475569;margin-bottom:16px}
.item{display:flex;align-items:flex-start;gap:22px;margin-top:24px}
.num{font-family:'Bebas Neue',sans-serif;font-size:52px;color:#0A0F1E;background:#F59E0B;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:4px;line-height:1}
.item-body{}
.item-title{font-family:'DM Sans',sans-serif;font-size:32px;font-weight:700;color:#ffffff;margin-bottom:4px}
.item-desc{font-family:'DM Sans',sans-serif;font-size:28px;color:#94A3B8;line-height:1.4}
.url-box{background:#0D1A2E;border:2px solid rgba(13,148,136,.4);border-radius:14px;padding:20px 28px;margin-top:30px;font-family:'DM Sans',sans-serif;font-size:34px;font-weight:700;color:#0D9488;letter-spacing:1px}
.footer{position:absolute;bottom:52px;left:90px;right:90px;display:flex;align-items:center;justify-content:space-between}
.footer img{height:68px;opacity:.9}
.pips{display:flex;gap:8px}
.pip{width:10px;height:10px;border-radius:50%;background:#1E293B}
.pip.active{background:#F59E0B}
</style></head>
<body>
<div class="slide">
  <div class="label">Tito AI · W28 Miyerkules · Demo</div>
  <span class="t-line t-gold">PAANO</span>
  <span class="t-line t-white">MAGSIMULA?</span>
  <div class="divider"></div>
  <div class="item">
    <div class="num">1</div>
    <div class="item-body">
      <div class="item-title">Pumunta sa:</div>
      <div class="item-desc">gemini.google.com</div>
    </div>
  </div>
  <div class="item">
    <div class="num">2</div>
    <div class="item-body">
      <div class="item-title">Log in gamit ang Gmail</div>
      <div class="item-desc">Yun lang. Libre.</div>
    </div>
  </div>
  <div class="item">
    <div class="num">3</div>
    <div class="item-body">
      <div class="item-title">I-type ang tanong mo</div>
      <div class="item-desc">Sagot agad. Walang bayad.</div>
    </div>
  </div>
  <div class="footer">
    <img src="http://localhost:8765/assets/logo-horizontal.png" alt="Tito AI">
    <div class="pips"><div class="pip"></div><div class="pip active"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
  </div>
</div>
</body></html>
