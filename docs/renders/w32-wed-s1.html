<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>W32 Wed S1 Hook</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0A0F1E}
.slide{width:1080px;height:1350px;background:#0A0F1E;position:relative;display:flex;flex-direction:column;overflow:hidden;justify-content:flex-end;padding:80px 90px 160px}
.t-line{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:2px;display:block}
.t-gold{color:#F59E0B}.t-white{color:#fff}.t-teal{color:#0D9488}
.divider{width:100%;height:3px;background:linear-gradient(90deg,#F59E0B 0%,rgba(245,158,11,.15) 100%)}
.lbl2{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#475569}
.sub{font-family:'DM Sans',sans-serif;font-size:32px;color:#94A3B8;line-height:1.5}
.photo-zone{position:absolute;top:0;left:0;width:100%;height:65%;background:linear-gradient(135deg,#0D1A2E 0%,#1a2744 40%,#0f2040 60%,#0A0F1E 100%);display:flex;align-items:center;justify-content:center}
.photo-label{font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:rgba(245,158,11,.3);border:2px dashed rgba(245,158,11,.2);padding:20px 36px;border-radius:8px}
.overlay{position:absolute;top:0;left:0;width:100%;height:70%;background:linear-gradient(180deg,transparent 30%,#0A0F1E 100%)}
.cnt{position:relative;z-index:2}
.footer{position:absolute;bottom:52px;left:90px;right:90px;display:flex;align-items:center;justify-content:space-between}
.footer img{height:68px;opacity:.9}
.fpips{display:flex;gap:8px}
.fpip{width:10px;height:10px;border-radius:50%;background:#1E293B}
.fpip.a{background:#F59E0B}
</style>
</head><body>
<div class="slide" data-document-role="page" data-label="S1 Hook">
  <div class="photo-zone"><div class="photo-label">REPLACE WITH PHOTO</div></div>
  <div class="overlay"></div>
  <div class="cnt">
    <div class="lbl2" style="margin-bottom:20px">Tito AI · W32 Wed · Guro Demo</div>
    <span class="t-line t-white" style="font-size:110px;line-height:.92">30 BATA.</span>
    <span class="t-line t-gold" style="font-size:110px;line-height:.92">30 REPORTS.</span>
    <span class="t-line t-teal" style="font-size:82px;line-height:.95;margin-top:12px">3 MINUTO</span>
    <span class="t-line t-white" style="font-size:82px;line-height:.95">KAY CLAUDE.</span>
    <div class="divider" style="margin:28px 0"></div>
    <div class="sub">Gamitin ang AI para gumawa ng parent progress reports — libre, mabilis, malinaw.</div>
  </div>
  <div class="footer">
    <img src="https://jeffd1130.github.io/TitoAi/assets/logo-horizontal.png" alt="Tito AI">
    <div class="fpips"><div class="fpip a"></div><div class="fpip"></div><div class="fpip"></div><div class="fpip"></div><div class="fpip"></div></div>
  </div>
</div>
</body></html>
