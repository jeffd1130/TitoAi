<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>W31 Mon S4 Result</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0A0F1E}
.slide{width:1080px;height:1350px;background:#0A0F1E;position:relative;display:flex;flex-direction:column;overflow:hidden;padding:80px 90px;justify-content:center}
.slide::before{content:'';position:absolute;top:-120px;right:-120px;width:420px;height:420px;border-radius:50%;background:#0D9488;opacity:.04;pointer-events:none}
.t-line{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:2px;display:block}
.t-gold{color:#F59E0B}.t-white{color:#fff}.t-teal{color:#0D9488}
.divider{width:100%;height:3px;background:linear-gradient(90deg,#F59E0B 0%,rgba(245,158,11,.15) 100%)}
.lbl2{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#475569}
.output-box{background:#111827;border:1px solid #1E293B;border-radius:12px;padding:24px 28px}
.output-box .olbl{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#0D9488;margin-bottom:12px}
.output-box .otxt{font-family:'DM Sans',sans-serif;font-size:22px;color:#94A3B8;line-height:1.7}
.photo-badge{position:absolute;top:90px;right:90px;background:rgba(13,148,136,.15);border:2px dashed rgba(13,148,136,.3);border-radius:8px;padding:12px 20px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(13,148,136,.5)}
.footer{position:absolute;bottom:52px;left:90px;right:90px;display:flex;align-items:center;justify-content:space-between}
.footer img{height:68px;opacity:.9}
.fpips{display:flex;gap:8px}
.fpip{width:10px;height:10px;border-radius:50%;background:#1E293B}
.fpip.a{background:#F59E0B}
</style>
</head><body>
<div class="slide" data-document-role="page" data-label="S4 Result">
  <div class="photo-badge">ADD SCREENSHOT</div>
  <div class="lbl2" style="margin-bottom:24px">Tito AI · W31 Mon · Result</div>
  <span class="t-line t-gold" style="font-size:108px;line-height:.95">ISANG</span>
  <span class="t-line t-white" style="font-size:108px;line-height:.95">PROMPT.</span>
  <span class="t-line t-teal" style="font-size:108px;line-height:.95">TAPOS NA.</span>
  <div class="divider" style="margin:24px 0"></div>
  <div class="output-box">
    <div class="olbl">Claude Output</div>
    <div class="otxt">"Hi [Client], I wanted to follow up on last week's deliverables. Everything is on track — I'll send the final files by Friday. Let me know if you need anything in the meantime."</div>
  </div>
  <div class="footer">
    <img src="https://jeffd1130.github.io/TitoAi/assets/logo-horizontal.png" alt="Tito AI">
    <div class="fpips"><div class="fpip"></div><div class="fpip"></div><div class="fpip"></div><div class="fpip a"></div><div class="fpip"></div></div>
  </div>
</div>
</body></html>
