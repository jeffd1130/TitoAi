<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>W31 Mon S4 Result</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#FAF8F4}
.slide{width:1080px;height:1350px;background:#FAF8F4;position:relative;display:flex;flex-direction:column;overflow:hidden;padding:80px 90px 140px}
.lbl2{font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#9CA3AF;margin-bottom:28px}
.headline{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:2px;line-height:.92;display:block}
.h-navy{color:#0A0F1E}
.h-gold{color:#F59E0B}
.h-teal{color:#0D9488}
.divider{width:100%;height:3px;background:linear-gradient(90deg,#F59E0B 0%,rgba(245,158,11,.12) 100%);margin:32px 0}
.result-card{background:#fff;border-radius:16px;border-left:5px solid #F59E0B;padding:28px 32px;box-shadow:0 4px 20px rgba(10,15,30,.08)}
.result-label{display:inline-flex;align-items:center;gap:8px;background:#FEF3C7;color:#92400E;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;padding:6px 14px;border-radius:20px;margin-bottom:18px}
.result-body{font-family:'DM Sans',sans-serif;font-size:24px;color:#374151;line-height:1.75}
.photo-zone-sm{position:absolute;top:80px;right:90px;background:#FEF3C7;border:2px dashed #F59E0B;border-radius:12px;padding:10px 18px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#92400E}
.footer-band{position:absolute;bottom:0;left:0;right:0;height:96px;background:#0A0F1E;display:flex;align-items:center;justify-content:space-between;padding:0 90px}
.footer-band img{height:60px;opacity:.9}
.fpips{display:flex;gap:8px}
.fpip{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2)}
.fpip.a{background:#F59E0B}
</style>
</head><body>
<div class="slide" data-document-role="page" data-label="S4 Result">
  <div class="photo-zone-sm">Add Screenshot</div>
  <div class="lbl2">Tito AI · W31 Mon · Result</div>
  <span class="headline h-gold" style="font-size:92px">ISANG</span>
  <span class="headline h-navy" style="font-size:92px">PROMPT.</span>
  <span class="headline h-teal" style="font-size:92px">TAPOS NA.</span>
  <div class="divider"></div>
  <div class="result-card">
    <div class="result-label">✦ Claude Output</div>
    <div class="result-body">"Hi [Client], I wanted to follow up on last week's deliverables. Everything is on track — I'll send the final files by Friday. Let me know if you need anything in the meantime."</div>
  </div>
  <div class="footer-band">
    <img src="https://jeffd1130.github.io/TitoAi/assets/logo-horizontal.png" alt="Tito AI">
    <div class="fpips"><div class="fpip"></div><div class="fpip"></div><div class="fpip"></div><div class="fpip a"></div><div class="fpip"></div></div>
  </div>
</div>
</body></html>
