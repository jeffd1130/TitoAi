<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden}
.slide{width:1080px;height:1350px;background:#0A0F1E;position:relative;display:flex;flex-direction:column;justify-content:center;padding:80px 90px;overflow:hidden}
.slide::before{content:'';position:absolute;top:-120px;right:-120px;width:420px;height:420px;border-radius:50%;background:#F59E0B;opacity:.04;pointer-events:none}
.slide::after{content:'';position:absolute;bottom:-80px;left:-80px;width:300px;height:300px;border-radius:50%;background:#0D9488;opacity:.05;pointer-events:none}
.label{font-family:'DM Sans',sans-serif;font-size:22px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#475569;margin-bottom:20px}
.t-line{font-family:'Bebas Neue',Impact,sans-serif;font-size:112px;line-height:1.0;letter-spacing:2px;display:block}
.t-gold{color:#F59E0B}.t-white{color:#ffffff}
.divider{width:100%;height:3px;background:linear-gradient(90deg,#F59E0B 0%,rgba(245,158,11,.15) 100%);margin:28px 0}
.prompt-box{background:#0D2818;border:2px solid #0D9488;border-radius:12px;padding:28px 32px;margin-top:4px}
.prompt-label{font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#0D9488;margin-bottom:14px}
.prompt-text{font-family:'DM Sans',sans-serif;font-size:30px;color:#A7F3D0;line-height:1.65}
.footer{position:absolute;bottom:52px;left:90px;right:90px;display:flex;align-items:center;justify-content:space-between}
.footer img{height:68px;opacity:.9}
.pips{display:flex;gap:8px}
.pip{width:10px;height:10px;border-radius:50%;background:#1E293B}
.pip.active{background:#F59E0B}
</style></head>
<body>
<div class="slide">
  <div class="label">Tito AI · W29 Miyerkules · Demo</div>
  <span class="t-line t-white">ANG</span>
  <span class="t-line t-gold">PROMPT</span>
  <div class="divider"></div>
  <div class="prompt-box">
    <div class="prompt-label">I-type mo ito sa Claude:</div>
    <div class="prompt-text">I am a Virtual Assistant with 2 years of experience in email management, scheduling, and social media. Write me a professional resume summary and a short cover letter for a US-based client. Keep it concise and confident.</div>
  </div>
  <div class="footer">
    <img src="http://localhost:8766/assets/logo-horizontal.png" alt="Tito AI">
    <div class="pips"><div class="pip"></div><div class="pip"></div><div class="pip active"></div><div class="pip"></div><div class="pip"></div></div>
  </div>
</div>
</body></html>
