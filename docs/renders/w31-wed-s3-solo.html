<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden}
.slide{width:1080px;height:1350px;background:#0A0F1E;position:relative;display:flex;flex-direction:column;justify-content:center;padding:80px 90px;overflow:hidden}
.slide::before{content:'';position:absolute;top:-120px;right:-120px;width:420px;height:420px;border-radius:50%;background:#F59E0B;opacity:.04;pointer-events:none}
.label{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#475569;margin-bottom:24px}
.t-line{font-family:'Bebas Neue',Impact,sans-serif;font-size:96px;line-height:0.95;letter-spacing:2px;display:block}
.t-gold{color:#F59E0B}.t-white{color:#ffffff}.t-teal{color:#0D9488}
.divider{width:100%;height:3px;background:linear-gradient(90deg,#F59E0B 0%,rgba(245,158,11,.15) 100%);margin:24px 0}
.prompt-box{background:#0d1a2d;border:2px solid #0D9488;border-radius:12px;padding:24px 28px;margin-top:8px}
.prompt-label{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#0D9488;margin-bottom:12px}
.prompt-text{font-family:monospace;font-size:20px;color:#67e8f9;line-height:1.9}
.prompt-text .bracket{color:#F59E0B}
.footer{position:absolute;bottom:52px;left:90px;right:90px;display:flex;align-items:center;justify-content:space-between}
.footer img{height:68px;opacity:.9}
.pips{display:flex;gap:8px}
.pip{width:10px;height:10px;border-radius:50%;background:#1E293B}
.pip.active{background:#F59E0B}
</style></head>
<body>
<div class="slide">
  <div class="label">Tito AI · W31 Wed · The Prompt</div>
  <span class="t-line t-white">GAMITIN</span>
  <span class="t-line t-gold">ITO SA</span>
  <span class="t-line t-teal">CLAUDE.</span>
  <div class="divider"></div>
  <div class="prompt-box">
    <div class="prompt-label">Claude Prompt</div>
    <div class="prompt-text">Freelancer ako — <span class="bracket">[iyong trabaho]</span>.<br>Gusto ko ng proposal para sa<br><span class="bracket">[kliyente / project]</span>.<br>Kasama: scope, bayad, timeline.<br>Tone: propesyonal. 1 pahina lang.</div>
  </div>
  <div class="footer">
    <img src="http://localhost:8766/assets/logo-horizontal.png" alt="Tito AI">
    <div class="pips"><div class="pip"></div><div class="pip"></div><div class="pip active"></div><div class="pip"></div><div class="pip"></div></div>
  </div>
</div>
</body></html>
