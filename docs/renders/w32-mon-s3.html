<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>W32 Mon S3 Prompt</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0A0F1E}
.slide{width:1080px;height:1350px;background:#0A0F1E;position:relative;display:flex;flex-direction:column;overflow:hidden;padding:80px 90px 120px}
.lbl2{font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:28px}
.headline{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:2px;line-height:.92;display:block}
.h-white{color:#fff}
.h-gold{color:#F59E0B}
.h-teal{color:#0D9488}
.divider{width:100%;height:3px;background:linear-gradient(90deg,#0D9488 0%,rgba(13,148,136,.1) 100%);margin:32px 0}
.prompt-card{background:rgba(13,148,136,.1);border:2px solid rgba(13,148,136,.5);border-radius:16px;padding:32px 36px;margin-top:8px}
.step-label{display:inline-flex;align-items:center;gap:8px;background:#0D9488;color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;padding:6px 14px;border-radius:20px;margin-bottom:20px}
.prompt-body{font-family:'DM Sans',sans-serif;font-size:25px;color:rgba(255,255,255,.9);line-height:1.85}
.prompt-body .fill{display:inline;background:rgba(245,158,11,.2);color:#F59E0B;font-weight:700;padding:2px 8px;border-radius:6px}
.footer{position:absolute;bottom:52px;left:90px;right:90px;display:flex;align-items:center;justify-content:space-between}
.footer img{height:68px;opacity:.9}
.fpips{display:flex;gap:8px}
.fpip{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2)}
.fpip.a{background:#F59E0B}
</style>
</head><body>
<div class="slide" data-document-role="page" data-label="S3 Prompt">
  <div class="lbl2">Tito AI · W32 Mon · Prompt</div>
  <span class="headline h-white" style="font-size:88px">I-TYPE</span>
  <span class="headline h-gold" style="font-size:88px">ITO SA</span>
  <span class="headline h-teal" style="font-size:88px">CLAUDE.</span>
  <div class="divider"></div>
  <div class="prompt-card">
    <div class="step-label">✦ Claude Prompt</div>
    <div class="prompt-body">
      Ikaw ay data analyst sa <span class="fill">[industriya]</span>.<br>
      Gumawa ng malinaw na insight<br>
      summary ng <span class="fill">[trend o resulta]</span>.<br>
      Para sa <span class="fill">[brand / manager]</span><br>
      na hindi data professional.<br>
      Engaging, maigsi, may takeaway.
    </div>
  </div>
  <div class="footer">
    <img src="https://jeffd1130.github.io/TitoAi/assets/logo-horizontal.png" alt="Tito AI">
    <div class="fpips"><div class="fpip"></div><div class="fpip"></div><div class="fpip a"></div><div class="fpip"></div><div class="fpip"></div></div>
  </div>
</div>
</body></html>
