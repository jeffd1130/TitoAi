<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tito AI — Content Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Lora:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A0F1E; --card:#111827; --line:#1E2A3A; --gold:#F59E0B;
    --teal:#0D9488; --coral:#F97316; --green:#10B981; --gray:#94A3B8; --mute:#6B7280;
    --tiktok:#FF3D71; --ig:#E879F9; --fb:#60A5FA;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--navy);color:#E5E7EB;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--gold);color:var(--navy)}
  .wrap{max-width:880px;margin:0 auto;padding:44px 28px 72px}

  .head{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:24px}
  .logo{display:flex;align-items:center;gap:14px}
  .logo .ring{width:60px;height:60px;border-radius:50%;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
  .logo .ring b{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--gold);line-height:1}
  .logo .wm{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:1px;line-height:.9}
  .logo .wm span{color:var(--gold)}
  .logo .tg{font-family:'Lora',serif;font-style:italic;font-size:12px;color:var(--gray);margin-top:1px}
  .htxt{flex:1;min-width:240px;border-left:2px solid var(--line);padding-left:20px}
  .htxt h1{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:1.5px;color:#fff;line-height:.95}
  .htxt .sub{font-size:12px;font-weight:600;letter-spacing:2px;color:var(--gold);margin-top:5px}
  .htxt .meta{font-size:12px;color:var(--gray);margin-top:8px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat b{font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;display:block}
  .stat span{font-size:10.5px;color:var(--gray);letter-spacing:.5px}

  .filters{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap}
  .fbtn{font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--line);border-radius:30px;padding:9px 20px;cursor:pointer;background:transparent;color:var(--gray);font-family:'DM Sans',sans-serif;transition:.15s}
  .fbtn.on{background:var(--gold);color:var(--navy)}
  .refresh{margin-left:auto;font-size:11px;color:var(--mute);display:flex;align-items:center;gap:6px;align-self:center}
  .refresh .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  .week{margin-bottom:22px}
  .wlabel{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .wlabel .id{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;color:#fff}
  .wlabel .rg{font-size:11px;color:var(--gray)}
  .wlabel .hr{height:1px;flex:1;background:var(--line)}
  .week.hot .wlabel .id,.week.hot .wlabel .rg{color:var(--gold)}
  .week.hot .wlabel .rg{font-weight:600}
  .week.hot .wlabel .hr{background:rgba(245,158,11,.3)}
  .rows{display:flex;flex-direction:column;gap:8px}

  .row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;text-decoration:none;transition:border-color .15s}
  a.row:hover{border-color:var(--gold)}
  .row.draft{border-color:rgba(245,158,11,.35)}
  .day{font-weight:700;font-size:10px;letter-spacing:1.5px;padding:4px 10px;border-radius:5px;flex:none}
  .day.MON{background:var(--gold);color:var(--navy)}
  .day.WED{background:var(--teal);color:#fff}
  .day.FRI{background:var(--coral);color:var(--navy)}
  .info{flex:1;min-width:0}
  .info .ttl{font-size:14px;font-weight:700;color:#F9FAFB}
  .info .ttl .tag{color:var(--teal);font-weight:600}
  .info .ttl.tbd{color:var(--gray)}
  .info .nt{font-size:11.5px;color:var(--mute);margin-top:2px;font-style:italic}
  .badge{font-size:10px;font-weight:700;letter-spacing:.5px;padding:4px 10px;border-radius:20px;flex:none;white-space:nowrap}
  .b-posted{background:rgba(16,185,129,.14);color:var(--green);border:1px solid rgba(16,185,129,.3)}
  .b-draft{background:rgba(245,158,11,.14);color:var(--gold);border:1px solid rgba(245,158,11,.35)}
  .b-planned,.b-tbd{background:rgba(148,163,184,.1);color:var(--gray);border:1px solid rgba(148,163,184,.22)}
  .boost{font-size:9.5px;font-weight:700;letter-spacing:.5px;padding:4px 9px;border-radius:20px;flex:none;white-space:nowrap}
  .boost.TikTok{background:rgba(255,61,113,.12);color:var(--tiktok);border:1px solid rgba(255,61,113,.35)}
  .boost.Instagram{background:rgba(232,121,249,.1);color:var(--ig);border:1px solid rgba(232,121,249,.3)}
  .boost.Facebook{background:rgba(96,165,250,.1);color:var(--fb);border:1px solid rgba(96,165,250,.3)}
  .arr{color:var(--gold);font-size:17px;flex:none}

  /* TODAY box */
  .today-box{background:rgba(245,158,11,.07);border:2px solid rgba(245,158,11,.45);border-radius:14px;padding:18px 22px;margin-bottom:28px;display:flex;align-items:center;gap:18px}
  .today-box .pulse{width:11px;height:11px;border-radius:50%;background:var(--gold);flex:none;animation:pulse 1.8s infinite}
  .today-box .td{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--gold);line-height:1}
  .today-box .ts{font-size:12px;color:var(--gray);margin-top:4px;line-height:1.5}
  .today-box .ts b{color:#E5E7EB}
  /* Section headers */
  .sec-hdr{display:flex;align-items:center;gap:12px;margin:24px 0 12px}
  .sec-hdr .lbl{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:3px;text-transform:uppercase;white-space:nowrap}
  .sec-hdr.upcoming .lbl{color:var(--gold)}
  .sec-hdr.completed .lbl{color:var(--mute)}
  .sec-hdr .hr{flex:1;height:1px;background:var(--line)}

  .foot{border-top:1px solid var(--line);padding-top:18px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .foot .nm{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--mute)}
  .foot a{font-size:11px;color:var(--gold);text-decoration:none;font-weight:600}
  .loaderr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:13px;color:var(--gray)}

  /* ── extra day colors ── */
  .day.SUN{background:var(--coral);color:#fff}
  .day.SAT{background:var(--ig);color:#fff}
  .day.TUE,.day.THU{background:var(--fb);color:#fff}

  /* ── MOBILE ── */
  @media(max-width:600px){
    .wrap{padding:20px 14px 56px}
    .head{gap:12px;margin-bottom:16px}
    .logo .ring{width:46px;height:46px}
    .logo .ring b{font-size:20px}
    .logo .wm{font-size:30px}
    .logo .tg{font-size:11px}
    .htxt{border-left:none;padding-left:0;border-top:1px solid var(--line);padding-top:10px;width:100%}
    .htxt h1{font-size:32px}
    .htxt .meta{font-size:11px}
    .stats{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
    .stat{padding:10px 12px}
    .stat b{font-size:26px}
    .filters{gap:6px;margin-bottom:20px}
    .fbtn{font-size:11px;padding:7px 14px}
    .wlabel .rg{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
    .row{flex-wrap:wrap;gap:8px;padding:11px 12px}
    .info{width:100%;order:2;min-width:unset}
    .info .ttl{font-size:13px}
    .day{order:1}
    .badge{order:3;font-size:9px}
    .boost{order:4;font-size:9px}
    .arr{order:5}
    .today .lbl{font-size:14px;letter-spacing:1px}
    .foot{flex-direction:column;align-items:flex-start;gap:6px}
    .foot .nm{font-size:16px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="logo">
      <div class="ring"><b>AI</b></div>
      <div>
        <div class="wm">TITO <span>AI</span></div>
        <div class="tg">AI Para Sa Ating Lahat</div>
      </div>
    </div>
    <div class="htxt">
      <h1>CONTENT TIMELINE</h1>
      <div class="sub">W28 → W21 · NEWEST FIRST · MON · WED · FRI</div>
      <div class="meta">Every post, past and upcoming · <span id="handle">@TitoAIPH</span> · links open the live approval pages ↗</div>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="filters">
    <button class="fbtn on" data-f="all">All</button>
    <button class="fbtn" data-f="shipped">Shipped</button>
    <button class="fbtn" data-f="upcoming">Upcoming</button>
    <div class="refresh"><span class="dot"></span><span id="upd">live</span></div>
  </div>

  <div id="timeline"></div>

  <div class="foot">
    <div class="nm">TITO AI · AI PARA SA ATING LAHAT</div>
    <a id="hublink" href="#" target="_blank" rel="noopener">Open the Channel Hub ↗</a>
  </div>

</div>

<script>
/* ---------------------------------------------------------------
   Fallback data — used when schedule.json can't be fetched
   (e.g. opening the file directly). On the live site, schedule.json
   is the source of truth and overrides this. Claude Code edits
   schedule.json — it does NOT need to touch this file.
---------------------------------------------------------------- */
const FALLBACK = {"updated":"2026-06-26","handle":"@TitoAIPH","base":"https://jeffd1130.github.io/TitoAi/","weeks":[
  {"id":"W21","range":"May 19–25","theme":"Launch · Origin Story","boost":null,"posts":[
    {"day":"FRI","title":"Tito AI Intro — Origin Story","note":"\"Your Story\" launch · Household dad sa Silicon Valley","date":"May 23","status":"posted","url":null,"boost":null}]},
  {"id":"W22","range":"May 26–Jun 1","theme":"Intro Story","boost":null,"posts":[
    {"day":"FRI","title":"Intro Story · \"Your Story\"","note":"Warm tito intro · captions approved","date":"May 30","status":"posted","url":"W22-captions.html","boost":null}]},
  {"id":"W23","range":"Jun 1–7","theme":"Launch Week Follow-Through","boost":null,"posts":[
    {"day":"MON","title":"Tip #1 — Sino si Claude at Gemini","note":"Intro to both · libre pareho","date":"Jun 2","status":"posted","url":"scripts/w23-mon-script.html","boost":null},
    {"day":"WED","title":"Demo #1 — Gemini Beginner's Guide","note":"Gemini beginner walkthrough","date":"Jun 4","status":"posted","url":null,"boost":null},
    {"day":"FRI","title":"Story #1 — Hindi degree ang kailangan mo","note":"Anyone can learn AI · no background needed","date":"Jun 6","status":"posted","url":null,"boost":null}]},
  {"id":"W24","range":"Jun 8–14","theme":"Tools Deep-Dive","boost":null,"posts":[
    {"day":"MON","title":"Tip #2 — Claude o Gemini?","tag":"Carousel","note":"When to use which · 5-slide swipe","date":"Jun 9","status":"posted","url":"W24-mon-captions.html","boost":null},
    {"day":"WED","title":"Demo #2 — Claude para sa Negosyante","tag":"Carousel","note":"Walang marketing budget? · Php500 campaign","date":"Jun 11","status":"posted","url":"W24-wed-carousel.html","boost":null},
    {"day":"FRI","title":"Story #2 — Ang Trabaho Ko, Napalitan Na Ba?","note":"AI for everyday Filipinos","date":"Jun 13","status":"posted","url":"W24-fri-captions.html","boost":null}]},
  {"id":"W25","range":"Jun 15–21","theme":"Everyday Filipino Life","boost":null,"posts":[
    {"day":"MON","title":"Tip #3 — 3 Libreng AI Tools","note":"Dapat malaman ng bawat Pilipino","date":"Jun 16","status":"posted","url":"W25-mon-captions.html","boost":null},
    {"day":"WED","title":"Demo #3 — Resume Gamit Claude","tag":"Carousel","note":"Resume in 2 minutes · 5-slide swipe","date":"Jun 18","status":"posted","url":"W25-wed-captions.html","boost":null},
    {"day":"FRI","title":"Father's Day — Tito AI Tries: Php 2,000","note":"Real budget challenge","date":"Jun 20","status":"draft","url":"W25-fri-captions.html","boost":null}]},
  {"id":"W26","range":"Jun 22–28","theme":"⭐ BOOST LAUNCH · Php 2,000 · TikTok","highlight":true,"boost":"TikTok","posts":[
    {"day":"MON","title":"Ang Sabi Nila: Pang-Matalino Lang Iyan","note":"AI myth-busting · Carousel","date":"Jun 23","status":"draft","url":"W26-mon-captions.html","boost":"TikTok"},
    {"day":"WED","title":"Gemini para sa Guro","note":"Lesson plan in 2 mins · 900K+ teachers","date":"Jun 25","status":"draft","url":"W26-wed-captions.html","boost":"TikTok"},
    {"day":"FRI","title":"Nagbabago. Kaya Mo Pa Ba?","note":"AI change fatigue · Carousel · 5 slides","date":"Jun 27","status":"draft","url":"W26-fri-captions.html","boost":"TikTok"}]},
  {"id":"W27","range":"Jun 29–Jul 5","theme":"Compounding Advantage · Practical Tools","boost":null,"posts":[
    {"day":"MON","title":"July na! Claude Projects + Gemini Deep Research","note":"Dalawang bagay na kailangan mo ngayong July","date":"Jun 30","status":"draft","url":"W27-mon-captions.html","boost":null},
    {"day":"WED","title":"Claude Projects — I-Setup Natin ang Iyong Trabaho Space","note":"Step-by-step Claude Projects demo","date":"Jul 2","status":"draft","url":"W27-wed-captions.html","boost":null},
    {"day":"FRI","title":"Ang Taong Nagsimula Kahapon — May Kalamangan Na","note":"Compounding advantage · Carousel · 5 slides","date":"Jul 4","status":"draft","url":"W27-fri-captions.html","boost":null}]},
  {"id":"W28","range":"Jul 6–12","theme":"Everyday Tools · Family Angle","boost":null,"posts":[
    {"day":"MON","title":"Gemini sa Google Docs — Libre At Laging Nandoon","note":"Practical AI tip · hidden Gemini in Docs sidebar","date":"Jul 7","status":"draft","url":"W28-mon-captions.html","boost":null},
    {"day":"WED","title":"Resume at Cover Letter — Claude ang Gagawa","note":"Split screen demo · claude.ai libre","date":"Jul 9","status":"draft","url":"W28-wed-captions.html","boost":null},
    {"day":"FRI","title":"Ang Tatay na Nagtanong sa AI","note":"Family story · hindi degree ang kailangan","date":"Jul 11","status":"draft","url":"W28-fri-captions.html","boost":null}]}
]};

const STATUS_GROUP = { posted:'shipped', draft:'upcoming', planned:'upcoming', tbd:'upcoming' };
const STATUS_LABEL = { posted:'POSTED', draft:'DRAFT', planned:'PLANNED', tbd:'TBD' };
let DATA = null, FILTER = 'all';

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const tl = document.getElementById('timeline');
  if(!DATA || !DATA.weeks || !DATA.weeks.length){ tl.innerHTML = '<div class="loaderr">No schedule data found. Add <b>schedule.json</b> next to this file.</div>'; return; }

  document.getElementById('handle').textContent = DATA.handle || '@TitoAIPH';
  document.getElementById('hublink').href = DATA.base || '#';
  document.getElementById('upd').textContent = DATA.updated ? ('updated ' + DATA.updated) : 'live';

  // flatten for stats
  const all = [];
  DATA.weeks.forEach(w => (w.posts||[]).forEach(p => all.push(p)));
  const total = all.length;
  const shippedCount = all.filter(p => STATUS_GROUP[p.status]==='shipped').length;
  const upcomingCount = total - shippedCount;
  const boostWeeks = DATA.weeks.filter(w => w.boost).length;
  document.getElementById('stats').innerHTML =
    stat(total,'#fff','TOTAL POSTS') + stat(shippedCount,'var(--green)','SHIPPED') +
    stat(upcomingCount,'var(--gold)','UPCOMING') + stat(boostWeeks,'var(--tiktok)','BOOST WEEKS');

  // newest-first
  const weeksDesc = [...DATA.weeks].reverse();
  // partition: a week is "upcoming" if any post is upcoming; "completed" only if all posts shipped
  const upWeeks  = weeksDesc.filter(w => (w.posts||[]).some(p => STATUS_GROUP[p.status]==='upcoming'));
  const doneWeeks = weeksDesc.filter(w => (w.posts||[]).every(p => STATUS_GROUP[p.status]==='shipped'));

  // TODAY box always at top
  let html = buildTodayBox(DATA.updated, upWeeks.length, doneWeeks.length);

  // UPCOMING section
  if(FILTER==='all' || FILTER==='upcoming'){
    const upRows = upWeeks.map(w => weekHtml(w, FILTER==='all'?'all':'upcoming')).filter(Boolean).join('');
    if(upRows){
      html += '<div class="sec-hdr upcoming"><div class="lbl">Upcoming &nbsp;·&nbsp; '+upWeeks.length+' week'+(upWeeks.length!==1?'s':'')+'</div><div class="hr"></div></div>';
      html += upRows;
    }
  }

  // COMPLETED section
  if(FILTER==='all' || FILTER==='shipped'){
    const doneRows = doneWeeks.map(w => weekHtml(w, FILTER==='all'?'all':'shipped')).filter(Boolean).join('');
    if(doneRows){
      html += '<div class="sec-hdr completed"><div class="lbl">Completed &nbsp;·&nbsp; '+doneWeeks.length+' week'+(doneWeeks.length!==1?'s':'')+'</div><div class="hr"></div></div>';
      html += doneRows;
    }
  }

  tl.innerHTML = html;
}

function buildTodayBox(updated, upCt, doneCt){
  const dateStr = fmtTodayFull(updated);
  return '<div class="today-box"><div class="pulse"></div><div>'
    +'<div class="td">TODAY &nbsp;·&nbsp; '+esc(dateStr)+'</div>'
    +'<div class="ts"><b>'+upCt+' week'+(upCt!==1?'s':'')+' upcoming</b> &nbsp;·&nbsp; '+doneCt+' week'+(doneCt!==1?'s':'')+' completed</div>'
    +'</div></div>';
}

function weekHtml(w, filter){
  const rows = (w.posts||[]).map(p => {
    const grp = STATUS_GROUP[p.status] || 'upcoming';
    if(filter!=='all' && FILTER!=='all' && filter!==grp) return '';
    return rowHtml(p, w);
  }).filter(Boolean).join('');
  if(!rows) return '';
  return '<div class="week'+(w.highlight?' hot':'')+'">'
    +'<div class="wlabel"><div class="id">'+esc(w.id)+'</div><div class="rg">'+esc(w.range)+(w.theme?' · '+esc(w.theme):'')+'</div><div class="hr"></div></div>'
    +'<div class="rows">'+rows+'</div></div>';
}

function fmtTodayFull(iso){
  if(!iso) return 'TODAY';
  const months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const days=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return days[d.getDay()]+' · '+months[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
}

function stat(n,color,label){ return '<div class="stat"><b style="color:'+color+'">'+n+'</b><span>'+label+'</span></div>'; }

function rowHtml(p, w){
  const cls = 'row' + (p.status==='draft'?' draft':'');
  const day = '<span class="day '+esc(p.day)+'">'+esc(p.day)+'</span>';
  const ttlTbd = (p.status==='tbd') ? ' tbd' : '';
  const tag = p.tag ? ' <span class="tag">· '+esc(p.tag)+'</span>' : '';
  const note = p.note ? '<div class="nt">'+esc(p.note)+(p.date?' · '+esc(p.date):'')+'</div>' : (p.date?'<div class="nt">'+esc(p.date)+'</div>':'');
  const info = '<div class="info"><div class="ttl'+ttlTbd+'">'+esc(p.title)+tag+'</div>'+note+'</div>';
  const boost = p.boost ? '<span class="boost '+esc(p.boost)+'">BOOST · '+esc(p.boost.toUpperCase())+'</span>' : '';
  const badge = '<span class="badge b-'+esc(p.status)+'">'+esc(STATUS_LABEL[p.status]||p.status)+'</span>';
  const inner = day+info+boost+badge;
  if(p.url){
    const href = (DATA.base||'') + p.url;
    return '<a class="'+cls+'" href="'+esc(href)+'" target="_blank" rel="noopener">'+inner+'<span class="arr">↗</span></a>';
  }
  return '<div class="'+cls+'">'+inner+'</div>';
}


document.querySelectorAll('.fbtn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.fbtn').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  FILTER = b.dataset.f;
  render();
}));

async function load(){
  try{
    const res = await fetch('schedule.json?t=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    DATA = await res.json();
  }catch(e){
    if(!DATA) DATA = FALLBACK;   // keep last good data on a failed refresh
  }
  render();
}

load();
setInterval(load, 60000);  // re-check every 60s so an open tab stays live
</script>
</body>
</html>
