<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tito AI — Content Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A0F1E;--navy2:#111827;--navy3:#1E293B;--gold:#F59E0B;--teal:#0D9488;--gray:#94A3B8;--muted:#475569;--white:#fff;--coral:#F97316;--green:#10B981}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--white);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:60px}

/* HEADER */
.site-hdr{background:var(--navy2);border-bottom:2px solid var(--navy3);padding:14px 20px;position:sticky;top:0;z-index:100}
.hdr-inner{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo-row{display:flex;align-items:center;gap:12px}
.logo-row img{height:32px;display:block}
.hub-badge{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:3px;color:var(--gold);padding:3px 8px;border:1px solid rgba(245,158,11,.4);border-radius:4px}
.nav-pills{display:flex;gap:8px;flex-wrap:wrap}
.nav-pills a{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gray);text-decoration:none;padding:5px 12px;border:1px solid var(--navy3);border-radius:20px;transition:all .15s}
.nav-pills a:hover{color:var(--white);border-color:var(--gray)}

/* TODAY BAR */
.today-bar{background:rgba(245,158,11,.06);border-bottom:1px solid rgba(245,158,11,.2);padding:10px 20px}
.today-bar-inner{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px;width:100%}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.today-text{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;color:var(--gold)}
.today-updated{margin-left:auto;font-size:10px;color:var(--muted)}

/* MAIN */
main{max-width:860px;margin:0 auto;padding:20px}
.loading,.error{text-align:center;color:var(--gray);padding:40px;font-size:14px}

/* WEEK CARDS */
.week-card{border-radius:14px;margin-bottom:20px;overflow:hidden}
.card-current{border:2px solid var(--gold);box-shadow:0 0 0 1px rgba(245,158,11,.1),0 4px 24px rgba(245,158,11,.08)}
.card-next{border:2px solid var(--teal)}
.card-upcoming{border:1px solid var(--navy3)}

.card-hdr{padding:14px 18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-current .card-hdr{background:rgba(245,158,11,.07)}
.card-next .card-hdr{background:rgba(13,148,136,.06)}
.card-upcoming .card-hdr{background:var(--navy2)}

.card-hdr-left{display:flex;flex-direction:column;gap:5px}
.week-type-badge{font-size:9px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;padding:3px 10px;border-radius:3px;display:inline-block;width:fit-content}
.card-current .week-type-badge{background:var(--gold);color:var(--navy)}
.card-next .week-type-badge{background:var(--teal);color:var(--white)}
.card-upcoming .week-type-badge{background:var(--navy3);color:var(--gray)}
.week-id-row{display:flex;align-items:baseline;gap:10px}
.week-id{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;line-height:1}
.card-current .week-id{color:var(--gold)}
.card-next .week-id{color:var(--teal)}
.card-upcoming .week-id{color:var(--white)}
.week-range{font-size:12px;color:var(--gray)}
.card-hdr-right{text-align:right;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.week-theme{font-size:11px;color:var(--gray);max-width:220px;text-align:right;line-height:1.4}
.boost-chip{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:3px;background:rgba(249,115,22,.15);color:var(--coral);border:1px solid rgba(249,115,22,.3)}

/* POST ROWS */
.card-posts{padding:0 18px 14px;display:flex;flex-direction:column;gap:0;background:var(--navy)}
.card-current .card-posts{background:rgba(10,15,30,.85)}
.card-next .card-posts{background:rgba(10,15,30,.85)}
.post-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(30,41,59,.8);flex-wrap:wrap}
.post-row:last-child{border-bottom:none}
.day-pill{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:2px;padding:3px 9px;border-radius:4px;flex:none;min-width:44px;text-align:center}
.day-MON{background:rgba(13,148,136,.15);color:var(--teal);border:1px solid rgba(13,148,136,.3)}
.day-WED{background:rgba(245,158,11,.1);color:var(--gold);border:1px solid rgba(245,158,11,.25)}
.day-FRI{background:rgba(99,102,241,.12);color:#818CF8;border:1px solid rgba(99,102,241,.25)}
.day-SUN{background:var(--navy3);color:var(--gray);border:1px solid var(--navy3)}
.post-info{flex:1;min-width:160px}
.post-title{font-size:13px;font-weight:700;display:block;line-height:1.3}
.post-note{font-size:10px;color:var(--muted);display:block;margin-top:2px}
.post-tag{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#818CF8;margin-left:6px;vertical-align:middle}
.post-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-none}
.post-date{font-size:10px;color:var(--muted)}
.status-chip{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:2px 8px;border-radius:3px}
.status-posted{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25)}
.status-draft{background:rgba(245,158,11,.12);color:var(--gold);border:1px solid rgba(245,158,11,.25)}
.status-planned{background:var(--navy3);color:var(--muted);border:1px solid rgba(71,85,105,.3)}
.post-link{font-size:10px;font-weight:700;letter-spacing:1px;text-decoration:none;padding:3px 10px;border:1px solid var(--navy3);border-radius:6px;color:var(--gray);white-space:nowrap;transition:all .15s}
.post-link:hover{border-color:var(--gold);color:var(--gold)}

/* QUICK LINKS */
.quick-links{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 28px;padding:16px;background:var(--navy2);border-radius:12px;border:1px solid var(--navy3)}
.quick-links a{text-decoration:none;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:8px 16px;border:1px solid var(--navy3);border-radius:8px;color:var(--gray);transition:all .15s;flex:1;text-align:center;min-width:110px}
.quick-links a:hover{background:var(--navy3);color:var(--white)}
.quick-links a.ql-gold{border-color:rgba(245,158,11,.4);color:var(--gold)}
.quick-links a.ql-gold:hover{background:rgba(245,158,11,.08)}
.quick-links a.ql-teal{border-color:rgba(13,148,136,.3);color:var(--teal)}
.quick-links a.ql-teal:hover{background:rgba(13,148,136,.06)}

/* ARCHIVE SECTION */
.sec-divider{display:flex;align-items:center;gap:12px;margin:28px 0 16px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.sec-divider::before,.sec-divider::after{content:'';flex:1;height:1px;background:var(--navy3)}
.archive-list{background:var(--navy2);border:1px solid var(--navy3);border-radius:12px;overflow:hidden}
.archive-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid rgba(30,41,59,.6);flex-wrap:wrap}
.archive-row:last-child{border-bottom:none}
.arc-id{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;color:var(--muted);min-width:36px}
.arc-range{font-size:11px;color:var(--muted);min-width:90px}
.arc-theme{font-size:11px;color:var(--gray);flex:1}
.arc-count{font-size:10px;color:var(--muted);min-width:60px;text-align:right}
.arc-links{display:flex;gap:6px;flex-none}
.arc-links a{font-size:10px;font-weight:700;letter-spacing:1px;text-decoration:none;padding:2px 8px;border:1px solid var(--navy3);border-radius:4px;color:var(--muted);transition:all .15s}
.arc-links a:hover{color:var(--white);border-color:var(--gray)}

/* FOOTER */
.site-ftr{border-top:1px solid var(--navy3);padding:16px 20px;text-align:center;margin-top:40px}
.site-ftr a{color:var(--muted);text-decoration:none}
.site-ftr a:hover{color:var(--gold)}
</style>
</head>
<body>

<header class="site-hdr">
  <div class="hdr-inner">
    <div class="logo-row">
      <img src="assets/logo-horizontal.png" alt="Tito AI">
      <span class="hub-badge">CONTENT HUB</span>
    </div>
    <nav class="nav-pills">
      <a href="timeline.html">Timeline</a>
      <a href="links.html">All Links</a>
      <a href="https://tiktok.com/@tito.aiph" target="_blank">@tito.aiph ↗</a>
    </nav>
  </div>
</header>

<div class="today-bar">
  <div class="today-bar-inner">
    <span class="pulse"></span>
    <span class="today-text" id="today-label">LOADING...</span>
    <span class="today-updated" id="today-updated"></span>
  </div>
</div>

<main id="hub">
  <div class="loading">Loading schedule...</div>
</main>

<div class="site-ftr">
  <span>Tito AI · <strong style="color:var(--gold)">@TitoAIPH</strong> · AI Para Sa Ating Lahat ·
    <a href="timeline.html">Timeline</a> ·
    <a href="links.html">Links</a> ·
    <a href="archive/">Archive</a>
  </span>
</div>

<script>
const DAY_TIMES = {MON:'8 PM PHT', WED:'7 PM PHT', FRI:'7 PM PHT'};

function statusChip(s) {
  const m = {
    posted:{label:'POSTED ✓',cls:'status-posted'},
    draft:{label:'DRAFT',cls:'status-draft'},
    planned:{label:'PLANNED',cls:'status-planned'},
    live:{label:'LIVE ✓',cls:'status-posted'}
  };
  const v = m[s] || {label:s.toUpperCase(),cls:'status-planned'};
  return `<span class="status-chip ${v.cls}">${v.label}</span>`;
}

function postRow(p) {
  const tag = p.tag ? `<span class="post-tag">[${p.tag}]</span>` : '';
  const link = p.url ? `<a class="post-link" href="${p.url}" target="_blank">View →</a>` : '';
  const drop = DAY_TIMES[p.day] ? ` · ${DAY_TIMES[p.day]}` : '';
  return `
    <div class="post-row">
      <span class="day-pill day-${p.day}">${p.day}</span>
      <span class="post-info">
        <span class="post-title">${p.title}${tag}</span>
        ${p.note ? `<span class="post-note">${p.note}</span>` : ''}
      </span>
      <span class="post-meta">
        ${statusChip(p.status)}
        <span class="post-date">${p.date}${drop}</span>
        ${link}
      </span>
    </div>`;
}

function weekCard(w, type) {
  const badgeText = {current:'⭐ CURRENT WEEK', next:'NEXT WEEK', upcoming:'UPCOMING'}[type] || '';
  const badge = badgeText ? `<span class="week-type-badge">${badgeText}</span>` : '';
  const boost = w.boost ? `<span class="boost-chip">⚡ ${w.boost}</span>` : '';
  return `
    <div class="week-card card-${type}">
      <div class="card-hdr">
        <div class="card-hdr-left">
          ${badge}
          <div class="week-id-row">
            <span class="week-id">${w.id}</span>
            <span class="week-range">${w.range}</span>
          </div>
        </div>
        <div class="card-hdr-right">
          <span class="week-theme">${w.theme}</span>
          ${boost}
        </div>
      </div>
      <div class="card-posts">${(w.posts||[]).map(postRow).join('')}</div>
    </div>`;
}

function archiveRow(w) {
  const posts = w.posts || [];
  const postedCount = posts.filter(p=>p.status==='posted').length;
  const links = posts.filter(p=>p.url).map(p=>`<a href="${p.url}" target="_blank">${p.day}</a>`).join('');
  return `
    <div class="archive-row">
      <span class="arc-id">${w.id}</span>
      <span class="arc-range">${w.range}</span>
      <span class="arc-theme">${w.theme}</span>
      <span class="arc-count">${postedCount}/${posts.length} posted</span>
      <span class="arc-links">${links || '<span style="color:var(--muted);font-size:10px">—</span>'}</span>
    </div>`;
}

fetch('schedule.json?v=' + Date.now())
  .then(r => r.json())
  .then(data => {
    document.getElementById('today-label').textContent =
      'TODAY — Jun 26, 2026 · ' + data.handle;
    document.getElementById('today-updated').textContent =
      'Updated ' + data.updated;

    const weeks = data.weeks;
    const ci = weeks.findIndex(w => w.highlight);
    const current  = weeks[ci];
    const next     = weeks[ci + 1];
    const upcoming = weeks[ci + 2];
    const archive  = weeks.slice(0, ci).reverse();

    let html = '';
    if (current)  html += weekCard(current,  'current');
    if (next)     html += weekCard(next,     'next');
    if (upcoming) html += weekCard(upcoming, 'upcoming');

    html += `
      <div class="quick-links">
        <a href="timeline.html" class="ql-gold">📅 Full Timeline</a>
        <a href="links.html" class="ql-teal">🔗 All Canva Links</a>
        <a href="archive/">📁 Archive</a>
      </div>`;

    if (archive.length) {
      const oldest = archive[archive.length-1].id;
      const newest = archive[0].id;
      html += `
        <div class="sec-divider"><span>COMPLETED — ${oldest} to ${newest}</span></div>
        <div class="archive-list">${archive.map(archiveRow).join('')}</div>`;
    }

    document.getElementById('hub').innerHTML = html;
  })
  .catch(() => {
    document.getElementById('hub').innerHTML =
      '<div class="error">Could not load schedule.json</div>';
  });
</script>
</body>
</html>
